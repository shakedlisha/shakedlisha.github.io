<title>סטודיו המשחקים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style id="studio-css">
/* Layout: library of game cards → editor (page list beside the page form) → player on the marquee stage. One bright classroom look by choice. */
:root{
  --paper:#EEF7FD;--stage:#CFEAFB;--frame:#2F8FD8;--bulb:#FFF4B8;--card:#FFFFFF;--ink:#16324F;--muted:#5B7590;--line:#D7E6F2;
  --sun:#FFC52E;--sunDeep:#C98F00;--a0:#EF5B4F;--a1:#3A86E6;--a2:#2FAE70;--a3:#F2A91E;--good:#22A565;--bad:#E2483D;--goodBg:#E2F6EB;--badBg:#FDE7E5;
  --display:"Secular One","Fredoka","Arial Hebrew",Arial,sans-serif;--body:"Fredoka","Arial Hebrew",Arial,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
*{box-sizing:border-box}
[hidden]{display:none!important}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--frame);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
.btn{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:7px 14px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:var(--frame)}
.btn.primary{background:var(--frame);border-color:var(--frame);color:#fff}
.btn.sun{background:var(--sun);border-color:var(--sun)}
.btn.danger{color:var(--bad)}
.btn.danger.on{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.muted{color:var(--muted)}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

/* library */
.libhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.libhead h1{font-size:clamp(30px,5vw,44px);color:var(--frame);line-height:1.2}
.libhead p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.gcard .thumb{aspect-ratio:16/9;background:var(--stage);display:grid;place-items:center;font-size:48px;overflow:hidden}
.gcard .thumb img{width:100%;height:100%;object-fit:contain;background:#fff}
.gcard .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.gcard h3{font-size:22px;line-height:1.4}
.gcard .meta{font-size:14px;color:var(--muted)}
.gcard .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.empty{text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .big{font-size:56px}

/* editor */
.edhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.edhead input{flex:1;min-width:200px;font-family:var(--display);font-size:24px;border:2px solid var(--line);border-radius:12px;padding:4px 12px;background:var(--card)}
.save{font-size:14px;color:var(--muted);min-width:7em}
.ed{display:grid;grid-template-columns:230px minmax(0,1fr);gap:16px;align-items:start}
.plist{display:flex;flex-direction:column;gap:8px;position:sticky;top:12px}
.pitem{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:6px 8px;text-align:start;width:100%}
.pitem.on{border-color:var(--frame);background:var(--stage)}
.pitem .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--frame);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.pitem .pt{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.pitem .pt b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pitem .pt small{color:var(--muted)}
.addrow{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.formtop{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:6px 14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--frame);color:#fff}
.field{display:flex;flex-direction:column;gap:5px}
.field>label,.field>.lbl{font-weight:600;font-size:15px}
.field .hint{font-size:13px;color:var(--muted)}
.field input[type=text],.field textarea{border:2px solid var(--line);border-radius:12px;padding:8px 12px;font-size:22px;background:var(--card);width:100%;line-height:1.6}
.field textarea{resize:vertical;min-height:2.4em}
.imgbox{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.imgprev{width:200px;max-width:100%;aspect-ratio:4/3;border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;background:#fff;overflow:hidden;color:var(--muted);font-size:14px;text-align:center}
.imgprev img{width:100%;height:100%;object-fit:contain}
.imgprev.drop{border-color:var(--frame);background:var(--stage)}
.imgacts{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto 64px minmax(0,1fr) auto;gap:8px;align-items:center}
.opt input.emo{width:64px;text-align:center;font-size:24px;border:2px solid var(--line);border-radius:12px;padding:4px;background:var(--card)}
.opt input.txt{border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-size:22px;background:var(--card);min-width:0;line-height:1.6}
.opt.correct input.txt{border-color:var(--good);background:var(--goodBg)}
.opt .ok{display:flex;align-items:center;gap:4px;font-size:14px;font-weight:600;white-space:nowrap}
.opt .ok input{width:20px;height:20px;accent-color:var(--good)}
.x{border:0;background:none;font-size:20px;color:var(--muted);padding:4px 6px}
.tilesprev{display:flex;gap:8px;flex-wrap:wrap}
.tilesprev span{min-width:48px;height:48px;border-radius:10px;background:var(--sun);display:grid;place-items:center;font-size:28px;font-weight:600;padding:0 6px;line-height:1.5}
.warn{color:var(--bad);font-size:14px}
.pageacts{display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.niqqud{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);border-radius:12px;padding:8px 12px}
.niqqud .msg{font-size:14px;color:var(--muted)}

/* player */
.player{position:fixed;inset:0;background:var(--stage);z-index:5;display:grid;grid-template-rows:auto 1fr;gap:10px;
  padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;max-width:1000px;width:100%;margin:0 auto}
.pbar .ttl{font-family:var(--display);font-size:clamp(18px,2.4vw,24px);color:var(--frame);min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dots i{width:30px;height:30px;border-radius:50%;background:var(--card);border:3px solid var(--line);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:14px;color:var(--muted)}
.dots i.now{border-color:var(--frame);background:var(--frame);color:#fff}
.dots i.ok{border-color:var(--good);background:var(--good);color:#fff}
.icon{background:var(--card);border:3px solid var(--line);border-radius:14px;height:44px;min-width:44px;padding:0 10px;font-size:18px;font-weight:600;display:grid;place-items:center}
.ptools{display:flex;gap:6px}
.frame{min-height:0;max-width:1000px;width:100%;margin:0 auto;border-radius:30px;padding:14px;background-color:var(--frame);
  background-image:radial-gradient(circle,var(--bulb) 0 4px,transparent 5px);background-size:24px 24px;background-position:2px 2px}
.stagecard{height:100%;background:var(--card);border-radius:20px;overflow:auto;padding:clamp(14px,2.5vw,28px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2vh,18px);text-align:center}
.photo{position:relative;width:min(100%,420px);aspect-ratio:4/3;border-radius:20px;overflow:hidden;background:#fff;border:3px solid var(--line);flex:none;max-height:34vh}
.photo.small{width:min(100%,300px)}
.photo img{width:100%;height:100%;object-fit:contain;display:block}
.q{font-family:var(--display);font-weight:400;font-size:clamp(26px,4.4vw,48px);line-height:1.45;margin:0;text-wrap:balance}
.q.mid{font-size:clamp(22px,3.6vw,40px)}
.story{font-size:clamp(20px,3vw,30px);line-height:1.7;margin:0;max-width:26ch;text-wrap:balance}
.answers{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:clamp(10px,1.6vw,16px);width:100%;max-width:860px}
.ans{position:relative;min-height:clamp(66px,11vh,100px);border:0;border-radius:18px;background:var(--c);color:#fff;font-size:clamp(26px,4.2vw,44px);font-weight:600;line-height:1.5;
  box-shadow:0 6px 0 rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 12px;transition:transform .12s,opacity .3s}
.answers.long .ans{font-size:clamp(19px,2.6vw,30px);line-height:1.6}
.ans.c0{--c:var(--a0)}.ans.c1{--c:var(--a1)}.ans.c2{--c:var(--a2)}.ans.c3{--c:var(--a3)}
.ans:hover:not(:disabled){transform:translateY(-3px)}
.ans:disabled{cursor:default}.ans.dim{opacity:.35}
.ans.right{outline:6px solid var(--good);outline-offset:3px}
.ans.wrong{outline:6px solid var(--bad);outline-offset:3px;animation:shake .4s}
.slots,.tray{display:flex;gap:clamp(10px,1.6vw,16px);justify-content:center;flex-wrap:wrap}
.tray{min-height:clamp(74px,11vw,104px);padding:8px 14px;border-radius:18px;background:var(--stage);min-width:min(100%,360px)}
.slot{width:clamp(70px,10.5vw,100px);aspect-ratio:1;border:4px dashed var(--frame);border-radius:18px;display:grid;place-items:center;background:var(--card);position:relative}
.slot.over{background:var(--stage);border-style:solid}
.slot.bad{border-color:var(--bad);border-style:solid;background:var(--badBg);animation:shake .4s}
.slots.good .slot{border-color:var(--good);border-style:solid;background:var(--goodBg)}
.slot .n{position:absolute;top:-12px;inset-inline-start:-10px;width:26px;height:26px;border-radius:50%;background:var(--frame);color:#fff;font-size:14px;font-weight:700;display:grid;place-items:center}
.slots.good .slot .n{background:var(--good)}
.arrow{font-size:14px;color:var(--muted);font-weight:600}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.tile{width:clamp(64px,9.5vw,90px);aspect-ratio:1;border:0;border-radius:16px;background:var(--sun);color:var(--ink);font-weight:600;font-size:clamp(38px,5.8vw,58px);line-height:1.5;
  box-shadow:0 5px 0 var(--sunDeep);touch-action:none;user-select:none;-webkit-user-select:none;display:grid;place-items:center;padding:0}
.slot .tile{box-shadow:0 3px 0 var(--sunDeep)}
.tile.drag{position:fixed;z-index:30;pointer-events:none;transform:scale(1.12) rotate(-4deg);box-shadow:0 12px 24px rgba(22,50,79,.3)}
.feedback{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap;border-radius:18px;padding:10px 18px;animation:pop .35s cubic-bezier(.3,1.6,.6,1)}
.feedback.ok{background:var(--goodBg)}.feedback.no{background:var(--badBg)}
.feedback .msg{font-family:var(--display);font-size:clamp(22px,3vw,32px)}
.next,.go{font-family:var(--display);font-size:clamp(20px,2.6vw,26px);border:0;border-radius:16px;padding:8px 28px}
.next{background:var(--frame);color:#fff;box-shadow:0 5px 0 #1D6AA6}
.go{background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--sunDeep);font-size:clamp(24px,3vw,32px);padding:12px 44px}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.bigt{font-family:var(--display);font-weight:400;font-size:clamp(38px,6.5vw,72px);line-height:1.35;margin:0;text-wrap:balance}
.stars{display:flex;gap:10px;justify-content:center}.stars svg{width:clamp(56px,9vw,88px);height:auto;animation:pop .5s cubic-bezier(.3,1.6,.6,1) both}
.sub{font-size:clamp(18px,2.4vw,24px);color:var(--muted);margin:0}
.endacts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.pnav{display:flex;align-items:center;gap:8px}
.dots i{cursor:pointer}
.icon:disabled{opacity:.35;cursor:default}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .btn{border-color:var(--sun)}
.linkbox{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.linkbox code{direction:ltr;unicode-bidi:isolate;background:var(--paper);border-radius:8px;padding:2px 8px;font-size:13px;word-break:break-all}
.badge{font-size:12px;background:var(--sun);border-radius:999px;padding:1px 8px;font-weight:600}
@media (max-width:560px){.dots{display:none}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40}
@media (max-width:760px){.ed{grid-template-columns:1fr}.plist{position:static}}
@media (max-width:560px){.answers{grid-template-columns:1fr!important}.ans{min-height:56px}.pbar .ttl{display:none}.opt{grid-template-columns:auto 52px minmax(0,1fr) auto}.opt input.emo{width:52px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="shell"><div dir="rtl" lang="he">
  <main class="wrap" id="main"></main>
  <section class="player" id="player" hidden>
    <header class="pbar">
      <div class="ttl" id="pTitle"></div>
      <div class="pnav"><button class="icon" id="pPrev" aria-label="לעמוד הקודם" title="לעמוד הקודם">→</button><div class="dots" id="pDots"></div><button class="icon" id="pNext" aria-label="לעמוד הבא" title="לעמוד הבא">←</button></div>
      <div class="ptools">
        <button class="icon" id="pMute" title="צלילים" aria-label="צלילים">🔔</button>
        <button class="icon" id="pExit" title="יציאה" aria-label="יציאה">✕</button>
      </div>
    </header>
    <div class="frame"><div class="stagecard" id="stage"></div></div>
  </section>
</div>
<canvas id="confetti"></canvas>
<div class="savebar" id="saveBar" hidden></div>

const IMGS=DATA.images||{};delete DATA.images;
DATA.games.forEach(g=>(g.pages||[]).forEach(p=>{if(p.img&&p.img.startsWith('img:'))p.img=IMGS[p.img.slice(4)]||''}));
const games=DATA.games;

const PUBLIC_URL='https://shakedlisha.github.io/kids-games/';

/* ---------------- open editing without login: games are kept on this computer, shared by link ---------------- */
let PUBLIC_IDS=new Set(),HIDDEN=[],lsTimer=null;
function packGames(arr){
  const images={},seen=new Map();
  const out=structuredClone(arr);
  out.forEach(g=>(g.pages||[]).forEach(p=>{if(p.img&&p.img.startsWith('data:')){let k=seen.get(p.img);if(k==null){k=String(seen.size);seen.set(p.img,k);images[k]=p.img}p.img='img:'+k}}));
  return {games:out,images};
}
function unpackGames(obj){
  const im=(obj&&obj.images)||{};const arr=(obj&&Array.isArray(obj.games))?obj.games:[];
  arr.forEach(g=>(g.pages||[]).forEach(p=>{if(p.img&&p.img.startsWith('img:'))p.img=im[p.img.slice(4)]||''}));
  return arr;
}
function loadLocal(){
  let L=null;try{L=JSON.parse(localStorage.getItem('kg-local')||'null')}catch(e){}
  if(!L)return;
  HIDDEN=Array.isArray(L.hidden)?L.hidden:[];
  HIDDEN=HIDDEN.filter(id=>!PUBLIC_IDS.has(id));
  for(const id of HIDDEN){const i=games.findIndex(x=>x.id===id);if(i>=0)games.splice(i,1)}
  const mine=unpackGames(L).filter(g=>!PUBLIC_IDS.has(g.id));
  for(let k=mine.length-1;k>=0;k--){const g=mine[k];g._local=true;const i=games.findIndex(x=>x.id===g.id);if(i>=0)games.splice(i,1);games.unshift(g)}
}
function localSave(){

const b64url=bytes=>{let s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode.apply(null,bytes.subarray(i,i+0x8000));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};

async function shareLink(g){

async function readShared(hash){

function packData(){
  const out=structuredClone(DATA),images={},seen=new Map();
  out.games.forEach(g=>(g.pages||[]).forEach(p=>{if(p.img&&p.img.startsWith('data:')){let k=seen.get(p.img);if(k==null){k=String(seen.size);seen.set(p.img,k);images[k]=p.img}p.img='img:'+k}}));

function unpackData(obj){

async function uploadImage(f){
  const msg=$('#imgMsg');if(msg)msg.textContent='מכין את התמונה…';
  try{E.game.pages[E.sel].img=await shrink(f);markDirty();renderEditor()}

/* images are stored inside the page, so keep them small: up to 800px, JPEG */
function shrink(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),im=new Image();
  im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.82))};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('decode'))};im.src=u})}

/* auto niqqud through Claude */
async function autoNiqqud(){
  const p=E.game.pages[E.sel],msg=$('#niqMsg'),btn=$('#autoNiq');
  const fields={};
  if(p.type==='build'){fields.q=p.q;fields.word=p.word}
  else{fields.story=p.story;fields.q=p.q;fields.explain=p.explain;p.opts.forEach((o,i)=>fields['opt'+i]=o.t)}
  for(const k in fields)if(!strip(fields[k]).trim())delete fields[k];
  if(!Object.keys(fields).length){msg.textContent='אין עדיין טקסט לנקד.';return}
  btn.disabled=true;msg.textContent='מנקד…';
  const prompt=`You add full Hebrew vocalization (ניקוד מלא) to short texts for a first-grade game.
Follow the rules of the Academy of the Hebrew Language (כללי הניקוד של האקדמיה ללשון העברית): dagesh kal and dagesh hazak, shva, hataf vowels, patach gnuva, vav ha-hibur (וּ before shva and before ב/ו/מ/פ), ha-hayedia and prefixes בכל"ם with the article, shin/sin dots, and kamatz katan where it applies.
Keep every letter exactly as written (do not add or remove letters, including yod and vav), keep punctuation, digits, spaces and emoji. Only add or correct niqqud marks. Fix wrong niqqud that is already there.
Return only a JSON object with exactly the same keys and the vocalized strings as values.
Input: ${JSON.stringify(fields)}`;
  try{
    const out=await sample.json(prompt,{modelTier:'default'});
    let ok=0,skipped=0;
    for(const k in fields){const v=out&&out[k];if(typeof v!=='string'){skipped++;continue}
      if(strip(v).replace(/\s+/g,' ').trim()!==strip(fields[k]).replace(/\s+/g,' ').trim()){skipped++;continue}
      if(k.startsWith('opt'))p.opts[+k.slice(3)].t=v;else p[k]=v;ok++}
    touch();renderEditor();
    $('#niqMsg').textContent=skipped?`ניקדתי ${ok} שדות. ${skipped} שדות לא שונו כי האותיות בתשובה לא תאמו למקור.`:'הניקוד נוסף. כדאי לעבור עליו לפני שמשחקים.';
  }catch(e){btn.disabled=false;msg.textContent=e&&e.code==='rate_limited'?'יותר מדי בקשות. נסו שוב בעוד דקה.':e&&e.code==='not_granted'?'לא ניתן אישור לניקוד אוטומטי.':'הניקוד האוטומטי לא הצליח. נסו שוב.'}
}

/* ---------------- sounds ---------------- */
let ac,sound=true,noiseBuf,verb;
function actx(){ac=ac||new (window.AudioContext||window.webkitAudioContext)();return ac}
function tone(f,d=.15,type='sine',vol=.18,when=0){if(!sound)return;try{const a=actx(),t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d)}catch(e){}}
const sfx={right(){[523,659,784].forEach((f,i)=>tone(f,.16,'triangle',.14,i*.08))},wrong(){tone(220,.22,'sawtooth',.1);tone(165,.3,'sawtooth',.1,.18)},
  pick(){tone(660,.07,'triangle',.1)},fanfare(){[392,523,659,784,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',.18,i*.13))}};
/* applause: a room of people clapping. Each clap is a broad, low-mid noise burst made of a few
   hand impacts, many claps overlap, and a short room echo blends them together. */
function applause(){
  if(!sound)return;
  try{const a=actx();
    if(!noiseBuf){noiseBuf=a.createBuffer(1,Math.round(a.sampleRate*.25),a.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}
    if(!verb){const len=Math.round(a.sampleRate*.7),ir=a.createBuffer(2,len,a.sampleRate);
      for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3)*.6}
      verb=a.createConvolver();verb.buffer=ir;}
    const bus=a.createGain();bus.gain.value=.9;
    const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=350;hp.Q.value=.5;
    const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;lp.Q.value=.5;
    const dry=a.createGain();dry.gain.value=.7;const wet=a.createGain();wet.gain.value=.45;
    bus.connect(hp).connect(lp);lp.connect(dry).connect(a.destination);lp.connect(verb);verb.connect(wet).connect(a.destination);
    const t0=a.currentTime+.15,len=2.4,people=14;
    for(let p=0;p<people;p++){
      const rate=3.2+Math.random()*1.8,tone0=700+Math.random()*900,pan=a.createStereoPanner?a.createStereoPanner():null;
      if(pan){pan.pan.value=Math.random()*1.6-.8;pan.connect(bus)}
      let t=t0+Math.random()*.35;
      while(t<t0+len-.1){
        const env=Math.min(1,(t-t0)/.3)*Math.min(1,(t0+len-t)/.9);
        for(let k=0;k<3;k++){ /* a clap is a few quick impacts of the palms */
          const at=t+k*(.003+Math.random()*.004),src=a.createBufferSource();src.buffer=noiseBuf;
          const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=tone0*(0.85+Math.random()*.3);bp.Q.value=.35;
          const g=a.createGain(),v=(k?0.35:0.6)*env*(.6+Math.random()*.4)*.16;
          g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+.0015);g.gain.exponentialRampToValueAtTime(.0005,at+.045+Math.random()*.04);
          src.connect(bp).connect(g).connect(pan||bus);src.start(at,Math.random()*.15);src.stop(at+.12);
        }
        t+=1/rate*(.85+Math.random()*.3);
      }
    }
  }catch(e){}
}

function photo(p,cls=''){return p.img?`<div class="photo ${cls}"><img src="${esc(imgSrc(p.img))}" alt=""></div>`:''}
function showPage(i){
  P.page=i;dots();const p=P.g.pages[i];

  if(p.type==='build')return nextPage();
  renderChoose(p);

const nextPage=()=>P.page+1<P.g.pages.length?showPage(P.page+1):showEnd();

function feedback(msg){
  const t=$('#try');if(t)t.remove();
  const fb=document.createElement('div');fb.className='feedback ok';fb.innerHTML=`<span class="msg">${esc(msg)}</span>`;
  const nb=document.createElement('button');nb.className='next';nb.id='nextBtn';nb.textContent=nextLabel();nb.onclick=nextPage;fb.appendChild(nb);
  stage.appendChild(fb);nb.focus({preventScroll:true});

function tryAgain(){

  const d=document.createElement('div');d.className='feedback no';d.id='try';d.setAttribute('role','status');
  d.innerHTML='<span class="msg">🤔 נַסּוּ שׁוּב</span>';stage.appendChild(d);setTimeout(()=>{if(d.isConnected)d.remove()},1800);
}
function renderChoose(p){
  const opts=(p.opts||[]).filter(o=>o.t||o.e);const correct=p.opts[p.a];
  const long=opts.some(o=>strip(o.t).length>9);
  stage.innerHTML=`${photo(p,p.story?'small':'')}${p.story?`<p class="story">${esc(p.story)}</p>`:''}<h2 class="q">${esc(p.q)}</h2>
    <div class="answers ${long?'long':''}" style="--n:${Math.min(opts.length,opts.length===4&&long?2:4)}">${opts.map((o,i)=>`<button class="ans c${i}" data-i="${i}">${o.e?`<span aria-hidden="true">${esc(o.e)}</span>`:''}<span>${esc(o.t)}</span></button>`).join('')}</div>`;
  stage.querySelectorAll('.ans').forEach(b=>b.onclick=()=>{
    const o=opts[+b.dataset.i];
    if(o===correct){stage.querySelectorAll('.ans').forEach(x=>{x.disabled=true;if(x!==b)x.classList.add('dim')});b.classList.add('right');
      sfx.right();applause();confetti(70);markDone();feedback(p.explain||CHEERS[Math.random()*CHEERS.length|0])}
    else{b.classList.add('wrong');b.disabled=true;sfx.wrong();tryAgain()}
  });

let B;
function renderBuild(p){
  const tiles=tilesOf(p.word),word=tiles.join('');
  let order;for(let n=0;n<30;n++){order=shuffle(tiles.map((_,k)=>k));if(order.map(k=>tiles[k]).join('')!==word)break}
  B={tiles,word,tray:order,slots:Array(tiles.length).fill(null),bad:[],busy:false,done:false};
  stage.innerHTML=`${photo(p,'small')}<h2 class="q mid">${esc(p.q)}</h2>
    <div class="slots" id="slots"></div><div class="arrow" aria-hidden="true">↑ גִּרְרוּ לְמַעְלָה ↑</div><div class="tray" id="tray"></div>`;
  drawTiles();
}
function drawTiles(){
  const t=(k,from)=>`<button class="tile" data-k="${k}" data-from="${from}" aria-label="${esc(B.tiles[k])}">${esc(B.tiles[k])}</button>`;
  $('#slots').innerHTML=B.slots.map((k,s)=>`<div class="slot ${B.bad.includes(s)?'bad':''}" data-s="${s}"><span class="n">${s+1}</span>${k==null?'':t(k,'slot')}</div>`).join('');
  $('#tray').innerHTML=B.tray.map(k=>t(k,'tray')).join('');
  stage.querySelectorAll('.tile').forEach(bindTile);
}
function bindTile(el){
  el.addEventListener('pointerdown',e=>{
    if(B.busy||B.done)return;e.preventDefault();
    const k=+el.dataset.k,sx=e.clientX,sy=e.clientY;let ghost=null,ox=0,oy=0;
    const at=ev=>{const n=document.elementFromPoint(ev.clientX,ev.clientY);return n&&n.closest('.slot')};
    const move=ev=>{
      if(!ghost&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){const r=el.getBoundingClientRect();ox=sx-r.left;oy=sy-r.top;
        ghost=el.cloneNode(true);ghost.classList.add('drag');ghost.style.width=r.width+'px';ghost.style.height=r.height+'px';document.body.appendChild(ghost);el.style.opacity=.3}
      if(ghost){ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';
        stage.querySelectorAll('.slot.over').forEach(s=>s.classList.remove('over'));const s=at(ev);if(s)s.classList.add('over')}};
    const up=ev=>{removeEventListener('pointermove',move);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);
      if(ghost){ghost.remove();const s=at(ev);if(s)place(k,+s.dataset.s);else back(k)}
      else if(el.dataset.from==='slot')back(k);
      else{const s=B.slots.indexOf(null);if(s>=0)place(k,s)}};
    addEventListener('pointermove',move);addEventListener('pointerup',up);addEventListener('pointercancel',up);
  });
}
function place(k,s){
  const from=B.slots.indexOf(k),ti=B.tray.indexOf(k),other=B.slots[s];
  if(ti>=0)B.tray.splice(ti,1);if(from>=0)B.slots[from]=null;
  if(other!=null&&other!==k){if(from>=0)B.slots[from]=other;else B.tray.push(other)}
  B.slots[s]=k;B.bad=[];sfx.pick();drawTiles();
  if(B.slots.every(x=>x!=null))checkBuild();
}
function back(k){const s=B.slots.indexOf(k);if(s>=0){B.slots[s]=null;B.tray.push(k)}B.bad=[];drawTiles()}
function checkBuild(){
  const built=B.slots.map(k=>B.tiles[k]);
  if(built.join('')===B.word){
    B.done=true;$('#slots').classList.add('good');$('#tray').hidden=true;stage.querySelector('.arrow').hidden=true;
    sfx.right();applause();confetti(70);markDone();feedback('כָּל הַכָּבוֹד! בְּנִיתֶם: '+B.word);return;
  }
  B.busy=true;B.bad=built.map((x,s)=>x!==B.tiles[s]?s:-1).filter(s=>s>=0);
  sfx.wrong();drawTiles();tryAgain();
  setTimeout(()=>{B.bad.forEach(s=>{B.tray.push(B.slots[s]);B.slots[s]=null});B.bad=[];B.busy=false;drawTiles()},1100);
}
const STAR=`<svg viewBox="0 0 24 24"><path fill="#FFC52E" stroke="#16324F" stroke-width="1.2" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z"/></svg>`;
function showEnd(){
  P.page=P.g.pages.length;dots();
  stage.innerHTML=`<div class="stars">${STAR}${STAR}${STAR}</div><h2 class="bigt">כָּל הַכָּבוֹד!</h2><p class="sub">סִיַּמְתֶּם אֶת כָּל הַשְּׁאֵלוֹת</p>
    <div class="endacts"><button class="go" id="again">מְשַׂחֲקִים שׁוּב</button><button class="next" id="leave">${P.from==='edit'?'חזרה לעריכה':'לכל המשחקים'}</button></div>`;
  stage.querySelectorAll('.stars svg').forEach((s,i)=>s.style.animationDelay=(i*.25)+'s');
  sfx.fanfare();applause();confetti(200);
  $('#again').onclick=()=>startPlay(P.g,P.from);$('#leave').onclick=()=>$('#pExit').click();
}
document.addEventListener('keydown',e=>{if(view!=='play'||!/^[1-4]$/.test(e.key))return;const b=stage.querySelectorAll('.ans')[+e.key-1];if(b&&!b.disabled)b.click()});

/* confetti */
const cv=$('#confetti'),cx=cv.getContext('2d');let parts=[],raf=0;const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function confetti(n){if(reduce)return;cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;
  const cols=['#EF5B4F','#3A86E6','#F2A91E','#2FAE70','#FFC52E','#7A4FD6'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:cols[i%6],a:Math.random()*6,va:(Math.random()-.5)*.4,life:120});
  if(!raf)loop()}
function loop(){cx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);cx.clearRect(0,0,innerWidth,innerHeight);
  parts=parts.filter(p=>p.life-->0&&p.y<innerHeight+20);
  for(const p of parts){p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.life/30);cx.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);cx.restore()}
  raf=parts.length?requestAnimationFrame(loop):0;if(!raf)cx.clearRect(0,0,innerWidth,innerHeight)}

boot();
</script>
